<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>alyssa chai</title>
  <link rel="stylesheet" href="public/main.css"/>
  <link rel="stylesheet" href="public/blog.css"/>
  <link rel="stylesheet" href="public/base.css"/>
</head>
<body>

<nav>
  <a href="/" id="nav-home">~ $</a>
  <a href="/blog/" id="nav-blogs">blogs/</a>
  <a href="/projects/" id="nav-projects">projects/</a>
  <a href="/about/" id="nav-about">about</a>
</nav>

<div class="page active" id="page-home">

  <div class="banner-wrap">
    <div class="banner">
      <p class="banner-sub">Hi! I'm Alyssa and this is my corner of the internet.</p>
      <p class="banner-sub">Type <span style="color:var(--pink)">'help'</span> in the terminal to explore my site!</p>
    </div>
    <div class="status-bar">
      <div class="status-dot"></div>
      <span>system <b>online</b></span>
      <span>user <b>guest</b></span>
      <span>session <b>active</b></span>
      <span id="clock"></span>
    </div>
  </div>

  <div id="terminal-wrap">
    <div class="term-titlebar">
      <span class="term-title">guest@alyssachai.com: ~</span>
      <div class="term-dot red"></div>
      <div class="term-dot yellow"></div>
      <div class="term-dot green"></div>
    </div>
    <div id="output"></div>
    <div class="prompt-row">
      <span class="prompt-label">guest@alyssachai.com ~ $</span>
      <input id="cmd-input" type="text" autofocus autocomplete="off" spellcheck="false"/>
    </div>
  </div>

</div>

<script src="public/home.js"></script>
<script src="public/terminal.js"></script>
</body>
</html>
